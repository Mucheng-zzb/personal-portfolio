# 构建 web/ 并发布到 GitHub Pages（v0.2-B）
#
# 触发：push 到 main（仅 web/ 或本文件或过渡期的根目录三件套变更）、或在 Actions 页面手动 Run workflow。
# 前置条件（一次性人工步骤）：仓库 Settings → Pages → Source 必须选「GitHub Actions」。
# 细节与回滚方式见 README「部署」一节。
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-deploy.yml'
      # 过渡期：根目录三件套仍是线上来源，改动它们也要重新部署；
      # v0.2-B 硬门禁通过、删掉保活副本后，这三条路径可以移除。
      - 'index.html'
      - 'script.js'
      - 'style.css'
  # 手动触发：既用于上线前在分支上验证，也是回滚时指定旧 tag 重新部署的入口
  workflow_dispatch:

# Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一次 Pages 部署；刻意不 cancel，避免打断进行中的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          # Vite 8 要求 node ^20.19 || >=22.12
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 安装依赖并构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
